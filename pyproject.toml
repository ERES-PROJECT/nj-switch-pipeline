[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nj-switch-pipeline"
version = "0.3.0"
description = "Evidence-first collection of New Jersey supplier offers and contract summaries"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "playwright>=1.51,<2",
  "httpx>=0.27,<1", "pydantic>=2.9,<3", "pdfplumber>=0.11,<1",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
nj-switch = "nj_switch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nj_switch*"]

[tool.setuptools.package-data]
nj_switch = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
